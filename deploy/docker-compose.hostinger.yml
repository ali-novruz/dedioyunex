# Hostinger Docker Manager (VPS API). No registry and no file copy needed: each container clones the public
# GitHub repo and runs deploy/start-from-git.sh (the platform build is cached per commit in a volume).
# Redeploy a new commit: restart the project. Environment comes from the project's .env (see .env.example).
# DATABASE_URL: Supabase (preferred) — or the bundled "db" service (postgres://dedio:${DB_PASSWORD}@db:5432/dedio, DATABASE_SSL=disable).
x-from-git: &from-git
  image: node:24-bookworm   # includes git
  restart: unless-stopped
  working_dir: /app
  entrypoint: ["sh", "-c", "rm -rf /tmp/boot && git clone --depth 1 https://github.com/ali-novruz/dedioyunex /tmp/boot && exec sh /tmp/boot/deploy/start-from-git.sh \"$$0\""]

services:
  platform:
    <<: *from-git
    container_name: dedio-platform
    command: ["platform"]
    env_file: .env
    environment:
      DEMO_PARTNER_ORIGIN: https://${DEMO_DOMAIN}
    volumes: [dedio-platform-build:/app]
    depends_on: [db]
    labels:
      - traefik.enable=true
      - traefik.http.routers.dedio.rule=Host(`${BACKEND_DOMAIN}`)
      - traefik.http.routers.dedio.entrypoints=websecure
      - traefik.http.routers.dedio.tls.certresolver=letsencrypt
      - traefik.http.services.dedio.loadbalancer.server.port=3000

  db:
    image: postgres:16-alpine
    container_name: dedio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dedio
      POSTGRES_DB: dedio
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [dedio-db:/var/lib/postgresql/data]

  demo-partner:
    <<: *from-git
    container_name: dedio-demo
    command: ["demo"]
    environment:
      PLATFORM_URL: ${APP_URL}
      PORT: "4000"
    volumes: [dedio-demo-src:/app]
    labels:
      - traefik.enable=true
      - traefik.http.routers.dedio-demo.rule=Host(`${DEMO_DOMAIN}`)
      - traefik.http.routers.dedio-demo.entrypoints=websecure
      - traefik.http.routers.dedio-demo.tls.certresolver=letsencrypt
      - traefik.http.services.dedio-demo.loadbalancer.server.port=4000

volumes:
  dedio-db:
  dedio-platform-build:
  dedio-demo-src:
