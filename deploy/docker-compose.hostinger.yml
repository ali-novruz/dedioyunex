# For Hostinger Docker Manager (VPS API): images are built by GitHub Actions (.github/workflows/docker.yml)
# and pulled from GHCR, so no files need to be copied to the server. Environment comes from the project's .env.
# DATABASE_URL: Supabase (preferred) — or the bundled "db" service below (postgres://dedio:${DB_PASSWORD}@db:5432/dedio, DATABASE_SSL=disable)
# as an interim database until the Supabase connection string is set.
services:
  platform:
    image: ghcr.io/ali-novruz/dedioyunex-platform:latest
    container_name: dedio-platform
    restart: unless-stopped
    env_file: .env
    environment:
      DEMO_PARTNER_ORIGIN: https://${DEMO_DOMAIN}
    depends_on: [db]
    labels:
      - traefik.enable=true
      - traefik.http.routers.dedio.rule=Host(`${BACKEND_DOMAIN}`)
      - traefik.http.routers.dedio.entrypoints=websecure
      - traefik.http.routers.dedio.tls.certresolver=letsencrypt
      - traefik.http.services.dedio.loadbalancer.server.port=3000

  db:
    image: postgres:16-alpine
    container_name: dedio-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dedio
      POSTGRES_DB: dedio
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [dedio-db:/var/lib/postgresql/data]

  demo-partner:
    image: ghcr.io/ali-novruz/dedioyunex-demo:latest
    container_name: dedio-demo
    restart: unless-stopped
    environment:
      PLATFORM_URL: ${APP_URL}
    labels:
      - traefik.enable=true
      - traefik.http.routers.dedio-demo.rule=Host(`${DEMO_DOMAIN}`)
      - traefik.http.routers.dedio-demo.entrypoints=websecure
      - traefik.http.routers.dedio-demo.tls.certresolver=letsencrypt
      - traefik.http.services.dedio-demo.loadbalancer.server.port=4000

volumes:
  dedio-db:
