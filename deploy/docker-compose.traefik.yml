# Hostinger VPS (Traefik already running in host network mode, docker provider, entrypoint "websecure",
# cert resolver "letsencrypt"). No ports are published; Traefik routes by host name.
# Database: Supabase Postgres (DATABASE_URL in .env). Public URL: https://dedio.vercel.app (Vercel rewrites to BACKEND_DOMAIN).
# Usage: cp .env.example .env && edit && docker compose -f docker-compose.traefik.yml up -d --build
services:
  platform:
    build: { context: .., dockerfile: platform/Dockerfile }
    container_name: dedio-platform
    restart: unless-stopped
    env_file: .env
    environment:
      APP_URL: ${APP_URL}
      DEMO_PARTNER_ORIGIN: https://${DEMO_DOMAIN}
    labels:
      - traefik.enable=true
      - traefik.http.routers.dedio.rule=Host(`${BACKEND_DOMAIN}`)
      - traefik.http.routers.dedio.entrypoints=websecure
      - traefik.http.routers.dedio.tls.certresolver=letsencrypt
      - traefik.http.services.dedio.loadbalancer.server.port=3000

  demo-partner:
    build: { context: ../demo-partner }
    container_name: dedio-demo
    restart: unless-stopped
    environment:
      PLATFORM_URL: ${APP_URL}
    labels:
      - traefik.enable=true
      - traefik.http.routers.dedio-demo.rule=Host(`${DEMO_DOMAIN}`)
      - traefik.http.routers.dedio-demo.entrypoints=websecure
      - traefik.http.routers.dedio-demo.tls.certresolver=letsencrypt
      - traefik.http.services.dedio-demo.loadbalancer.server.port=4000
