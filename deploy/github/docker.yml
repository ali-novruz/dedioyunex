# Copy to .github/workflows/docker.yml once the GitHub token has the "workflow" and "write:packages" scopes
# (gh auth refresh -s workflow,write:packages). Images: ghcr.io/ali-novruz/dedioyunex-{platform,demo}.
name: docker images
on:
  push:
    branches: [main]
    paths: ["platform/**", "sdk/web/**", "demo-partner/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: platform
            context: .
            file: platform/Dockerfile
          - name: demo
            context: demo-partner
            file: demo-partner/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/ali-novruz/dedioyunex-${{ matrix.name }}:latest
            ghcr.io/ali-novruz/dedioyunex-${{ matrix.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/ali-novruz/dedioyunex
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
