# MƏNƏ UYĞUN on one VPS: platform + demo partner site behind Caddy (automatic HTTPS).
# Usage (on the server, in this folder):  cp .env.example .env  &&  edit .env  &&  docker compose up -d --build
services:
  platform:
    build: { context: .., dockerfile: platform/Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      APP_URL: https://${APP_DOMAIN}
      DEMO_PARTNER_ORIGIN: https://${DEMO_DOMAIN}
      DATA_DIR: /data
    volumes: [platform-data:/data]

  demo-partner:
    build: { context: ../demo-partner }
    restart: unless-stopped
    environment:
      PLATFORM_URL: https://${APP_DOMAIN}

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      DEMO_DOMAIN: ${DEMO_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [platform, demo-partner]

volumes:
  platform-data:
  caddy-data:
  caddy-config:
